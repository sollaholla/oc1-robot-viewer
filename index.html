<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>OC-1 office delivery robot, rev C: 3D viewer</title>
<style>
:root {
  --bg: #e9ecef; --panel: rgba(255, 255, 255, 0.92); --ink: #14171c; --mute: #5d6570; --line: #d6dbe1;
  --accent: #2e6be6; --accent-2: #6ca5ff; --chip: #eef3ff; --shadow: 0 6px 24px rgba(16, 24, 40, 0.12);
  --side: 340px; --head: 54px;
  font-family: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
}
body.dark { --bg: #07090d; --panel: rgba(20, 23, 30, 0.9); --ink: #e8ecf3; --mute: #98a2b3; --line: #2a2f3a; --chip: #18223a; --shadow: 0 6px 24px rgba(0, 0, 0, 0.5); }
[hidden] { display: none !important; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden; }
button { font: inherit; color: inherit; }
a { color: var(--accent); }
body.dark a { color: var(--accent-2); }

#app { position: fixed; inset: 0; display: grid; grid-template-columns: var(--side) 1fr; grid-template-rows: var(--head) 1fr; }
header { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; padding: 0 14px; border-bottom: 1px solid var(--line); background: var(--panel); backdrop-filter: blur(8px); z-index: 3; }
.mark { width: 30px; height: 30px; border-radius: 8px; background: var(--accent); color: #fff; display: grid; place-items: center; font-weight: 800; font-style: italic; font-size: 18px; flex: none; }
.ttl { min-width: 0; }
.ttl b { display: block; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ttl span { display: block; font-size: 12px; color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.grow { flex: 1; }
.badge { font-size: 11px; padding: 3px 8px; border-radius: 99px; background: var(--chip); color: var(--accent); font-weight: 600; white-space: nowrap; }
body.dark .badge { color: var(--accent-2); }
#partsBtn { border: 1px solid var(--line); background: transparent; border-radius: 8px; padding: 6px 10px; font-size: 13px; cursor: pointer; }
#partsBtn.on { background: var(--accent); color: #fff; border-color: var(--accent); }
body.noparts #app { grid-template-columns: 1fr; }
body.noparts aside { display: none; }

aside { grid-row: 2; display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--line); background: var(--panel); z-index: 2; }
.search { padding: 10px 12px; border-bottom: 1px solid var(--line); }
.search input { width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--ink); font: inherit; font-size: 14px; }
.sum { display: flex; justify-content: space-between; font-size: 12px; color: var(--mute); margin-top: 8px; }
#list { overflow: auto; flex: 1; padding: 4px 0 24px; overscroll-behavior: contain; }
.grp { font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--mute); padding: 14px 14px 6px; display: flex; justify-content: space-between; }
.item { display: grid; grid-template-columns: 38px 1fr auto; gap: 6px; align-items: center; padding: 7px 12px 7px 14px; cursor: pointer; font-size: 13px; border-left: 3px solid transparent; }
.item:hover { background: rgba(46, 107, 230, 0.07); }
.item.on { background: rgba(46, 107, 230, 0.13); border-left-color: var(--accent); }
.item.nomodel { opacity: 0.55; cursor: default; }
.key { font-size: 11px; font-weight: 700; color: var(--accent); }
body.dark .key { color: var(--accent-2); }
.price { font-size: 12px; color: var(--mute); white-space: nowrap; }
.sub { display: grid; grid-template-columns: 1fr auto; gap: 6px; align-items: center; padding: 4px 12px 4px 58px; font-size: 12.5px; cursor: pointer; color: var(--mute); }
.sub:hover { color: var(--ink); }
.sub.on { color: var(--accent); font-weight: 600; }
.foot { padding: 8px 14px; border-top: 1px solid var(--line); font-size: 12px; }
.eye { border: 0; background: none; cursor: pointer; padding: 2px 4px; opacity: 0.6; font-size: 13px; }
.eye.off { opacity: 0.25; text-decoration: line-through; }

main#viewport { position: relative; grid-row: 2; grid-column: -2 / -1; min-width: 0; min-height: 0; overflow: hidden; touch-action: none; }
main#viewport > canvas { position: absolute; inset: 0; width: 100% !important; height: 100% !important; display: block; outline: none; }
#status { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; color: var(--mute); font-size: 14px; pointer-events: none; }
#status .bar { width: 220px; height: 4px; border-radius: 4px; background: var(--line); margin: 10px auto 0; overflow: hidden; }
#status .bar i { display: block; height: 100%; width: 30%; background: var(--accent); animation: slide 1.1s infinite ease-in-out; }
@keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(340%); } }
#tip { position: absolute; pointer-events: none; padding: 4px 8px; border-radius: 6px; background: rgba(15, 18, 24, 0.86); color: #fff; font-size: 12px; white-space: nowrap; transform: translate(12px, 12px); z-index: 4; }

#dock { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px 12px; padding: 10px 14px; border-radius: 14px; background: var(--panel); box-shadow: var(--shadow); border: 1px solid var(--line); z-index: 3; width: max-content; max-width: calc(100% - 24px); }
#dock label { font-size: 12px; color: var(--mute); display: flex; align-items: center; gap: 8px; }
#explode { width: 150px; accent-color: var(--accent); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button, .tog, .vbtn { border: 0; background: transparent; padding: 6px 10px; font-size: 12.5px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button.on, .tog.on { background: var(--accent); color: #fff; }
.tog, .vbtn { border: 1px solid var(--line); border-radius: 8px; }
.vbtn:hover, .tog:hover, .seg button:hover { background: rgba(46, 107, 230, 0.1); }
.seg button.on:hover, .tog.on:hover { background: var(--accent); }
#views { position: absolute; left: 14px; top: 12px; display: flex; gap: 4px; z-index: 3; }
#views .vbtn { background: var(--panel); }
.sep { width: 1px; height: 22px; background: var(--line); }

#card { position: absolute; right: 14px; top: 14px; width: 360px; max-height: calc(100% - 110px); overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 14px 16px; z-index: 3; font-size: 13px; }
#card h2 { font-size: 17px; margin: 0 26px 6px 0; }
#card .x { position: absolute; right: 10px; top: 8px; border: 0; background: none; font-size: 20px; cursor: pointer; color: var(--mute); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 10px; }
.chip { font-size: 11px; padding: 2px 8px; border-radius: 99px; background: var(--chip); color: var(--accent); font-weight: 600; }
body.dark .chip { color: var(--accent-2); }
#card p { margin: 6px 0; line-height: 1.45; }
#card .k { color: var(--mute); }
.buy { border-top: 1px solid var(--line); margin-top: 10px; padding-top: 8px; }
.buy div { margin: 6px 0; line-height: 1.4; }
.buy .amt { font-weight: 600; }
.acts { display: flex; gap: 6px; margin-top: 12px; flex-wrap: wrap; }
.acts button { border: 1px solid var(--line); background: transparent; border-radius: 8px; padding: 6px 10px; cursor: pointer; font-size: 12.5px; }
.acts button:hover { background: rgba(46, 107, 230, 0.1); }
.parts-in { font-size: 12px; color: var(--mute); margin-top: 8px; }
#help { position: absolute; left: 16px; top: 52px; font-size: 12px; color: var(--mute); pointer-events: none; z-index: 1; }

@media (max-width: 820px) {
  :root { --head: 50px; }
  #app { grid-template-columns: 1fr; }
  .ttl span, #backend { display: none; }
  aside { position: absolute; left: 0; right: 0; bottom: 0; top: auto; height: 62%; border-right: 0; border-top: 1px solid var(--line); border-radius: 14px 14px 0 0; box-shadow: var(--shadow); transform: translateY(102%); transition: transform 0.22s ease; z-index: 6; }
  body.showparts aside { transform: none; }
  main#viewport { grid-column: 1; }
  #dock { bottom: 10px; gap: 6px 8px; padding: 8px 10px; }
  #explode { width: 120px; }
  #views .vbtn { padding: 5px 7px; font-size: 12px; }
  body.noparts aside { display: flex; }
  #card { left: 10px; right: 10px; width: auto; top: auto; bottom: 104px; max-height: 46%; }
  #help { display: none; }
}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="mark">R</div>
    <div class="ttl"><b>OC-1 office delivery robot, rev C</b><span id="sub">RC-OC1 · proposed design for Paesol · loading</span></div>
    <div class="grow"></div>
    <span class="badge" id="backend">starting</span>
    <button id="partsBtn" class="on">Parts</button>
  </header>
  <aside>
    <div class="search">
      <input id="q" type="search" placeholder="Search parts, e.g. Jetson, D2, caster" autocomplete="off">
      <div class="sum"><span id="count"></span><span id="total"></span></div>
    </div>
    <div id="list"></div>
    <div class="foot"><a href="credits.html" target="_blank" rel="noopener">Credits and licenses</a></div>
  </aside>
  <main id="viewport">
    <div id="status"><div><span id="statusText">Loading the 3D model</span><div class="bar"><i></i></div></div></div>
    <div id="views"><button class="vbtn" data-view="iso">3D</button><button class="vbtn" data-view="front">Front</button><button class="vbtn" data-view="side">Side</button><button class="vbtn" data-view="rear">Rear</button><button class="vbtn" data-view="top">Top</button></div>
    <div id="help">Drag to orbit, right-drag or two fingers to pan, scroll to zoom. Click any part.</div>
    <div id="tip" hidden></div>
    <section id="card" hidden></section>
    <div id="dock" hidden>
      <label>Explode <input id="explode" type="range" min="0" max="100" value="0"></label>
      <span class="sep"></span>
      <label>Shell <span class="seg" id="shell"><button data-v="solid" class="on">Solid</button><button data-v="ghost">Ghost</button><button data-v="hidden">Off</button></span></label>
      <button class="tog on" id="wires">Cables</button>
      <button class="tog" id="xray">X-ray</button>
      <button class="tog" id="lights">Lights</button>
    </div>
  </main>
</div>
<script src="model.js?v=6680cce556"></script>
<script src="main.js?v=a0ce87fcdc"></script>
</body>
</html>
